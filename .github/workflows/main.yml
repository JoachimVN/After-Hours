name: Update Project Status

on:
  create:
    branches:
      - '**'
  pull_request:
    types: [opened]

jobs:
  update-project-status:
    runs-on: self-hosted   # will pick any available self-hosted runner
    steps:
      - name: Determine status
        id: status
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: |
          if (${{ runner.os }} -eq 'Windows') {
            # PowerShell syntax for Windows
            Write-Output "Event name: ${{ github.event_name }}"
            if ("${{ github.event_name }}" -eq "create") {
              Write-Output "status_name=In progress" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Output "ref_name=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            } elseif ("${{ github.event_name }}" -eq "pull_request") {
              Write-Output "status_name=In review" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Output "ref_name=${{ github.head_ref }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          } else {
            # Bash syntax for Mac/Linux
            echo "Event name: ${{ github.event_name }}"
            if [ "${{ github.event_name }}" = "create" ]; then
              echo "status_name=In progress" >> $GITHUB_OUTPUT
              echo "ref_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            elif [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "status_name=In review" >> $GITHUB_OUTPUT
              echo "ref_name=${{ github.head_ref }}" >> $GITHUB_OUTPUT
            fi
          }

      - name: Update Project V2 Item
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const statusName = "${{ steps.status.outputs.status_name }}";
            const branchName = "${{ steps.status.outputs.ref_name }}";

            console.log("Branch/PR triggering workflow:", branchName);
            console.log("Status to set:", statusName);

            // Fetch all issues associated with the repo
            const issues = await github.rest.repos.listIssuesAssociatedWithRepo({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            // Match the issue based on branch naming convention (must include issue number)
            const issue = issues.data.find(i => branchName.includes(i.number));
            if (!issue) {
              console.log("No linked issue found for branch/PR:", branchName);
              return;
            }

            console.log("Matched issue number:", issue.number);

            // Fetch Project V2 items
            const projectData = await github.graphql(`
              query ($repoId: ID!) {
                repository(id: $repoId) {
                  projectsV2(first: 10) {
                    nodes {
                      id
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue { number }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { repoId: context.repo.node_id });

            let itemId;
            for (const project of projectData.repository.projectsV2.nodes) {
              const item = project.items.nodes.find(n => n.content?.number === issue.number);
              if (item) { itemId = item.id; break; }
            }

            if (!itemId) {
              console.log("No Project V2 item found for issue:", issue.number);
              return;
            }

            // Fetch status field and check option exists
            const fieldsData = await github.graphql(`
              query ($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { projectId: projectData.repository.projectsV2.nodes[0].id });

            const statusField = fieldsData.node.fields.nodes.find(f => f.name === "Status");
            if (!statusField) {
              console.log("Status field not found in Project V2. No update will be made.");
              return;
            }

            const statusOption = statusField.options.find(o => o.name === statusName);
            if (!statusOption) {
              console.log(`Status option "${statusName}" not found. No update will be made.`);
              return;
            }

            // Update Project V2 item
            await github.graphql(`
              mutation ($itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemField(input: {
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) { item { id } }
              }
            `, { itemId, fieldId: statusField.id, optionId: statusOption.id });

            console.log(`Updated issue #${issue.number} to status '${statusName}'`);
