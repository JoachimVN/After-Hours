name: Update Project Status

on:
  create:
    branches:
      - '**'   # Trigger on any new branch
  pull_request:
    types: [opened]

jobs:
  update-project-status:
    runs-on: ubuntu-latest
    steps:
      - name: Set up environment
        run: echo "Trigger: ${{ github.event_name }}"

      - name: Determine status
        id: status
        run: |
          if [ "${{ github.event_name }}" = "create" ]; then
            echo "status_name=In progress" >> $GITHUB_OUTPUT
            echo "ref_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "status_name=In review" >> $GITHUB_OUTPUT
            echo "ref_name=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Update Project V2 Item
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const statusName = "${{ steps.status.outputs.status_name }}";
            const branchName = "${{ steps.status.outputs.ref_name }}";

            // Fetch the issue linked to this branch/PR
            const issues = await github.rest.repos.listIssuesAssociatedWithRepo({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            // Find the issue matching the branch name (you may need a convention like issue#123-branch)
            const issue = issues.data.find(i => branchName.includes(i.number));

            if (!issue) {
              console.log("No linked issue found for branch/PR:", branchName);
              return;
            }

            // Fetch Project V2 items for this repository
            const projectItems = await github.graphql(`
              query ($repoId: ID!) {
                repository(id: $repoId) {
                  projectsV2(first: 10) {
                    nodes {
                      id
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              id
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { repoId: context.repo.node_id });

            // Find the item corresponding to the issue
            let itemId;
            for (const project of projectItems.repository.projectsV2.nodes) {
              const item = project.items.nodes.find(n => n.content?.number === issue.number);
              if (item) {
                itemId = item.id;
                break;
              }
            }

            if (!itemId) {
              console.log("No Project V2 item found for issue:", issue.number);
              return;
            }

            // Fetch the status field ID and the option ID for the desired status
            const fieldsQuery = await github.graphql(`
              query ($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { projectId: projectItems.repository.projectsV2.nodes[0].id });

            const statusField = fieldsQuery.node.fields.nodes.find(f => f.name === "Status");
            const statusOption = statusField.options.find(o => o.name === statusName);

            // Update the item
            await github.graphql(`
              mutation ($itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemField(input: {
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  item {
                    id
                  }
                }
              }
            `, {
              itemId,
              fieldId: statusField.id,
              optionId: statusOption.id
            });

            console.log(`Updated issue #${issue.number} to status '${statusName}'`);
