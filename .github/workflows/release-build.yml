name: Build And Publish Release

on:
  push:
    tags:
      - v*
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.0.0-beta.1
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Resolve Version From Tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.event.release.tag_name }}"
          }
          if (-not $tag.StartsWith("v")) {
            throw "Tag must start with v. Got: $tag"
          }
          $version = $tag.Substring(1)
          $isPreRelease = if ($tag.Contains("-")) { "true" } else { "false" }
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PRE_RELEASE=$isPreRelease" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set Maven Project Version
        shell: pwsh
        run: |
          mvn --batch-mode versions:set "-DnewVersion=${{ env.APP_VERSION }}" "-DgenerateBackupPoms=false"

      - name: Build Artifacts
        shell: pwsh
        run: |
          mvn --batch-mode package -DskipTests

      - name: Set versioned JAR name
        shell: pwsh
        run: |
          "JAR_NAME=AfterHours-${{ env.APP_VERSION }}.jar" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Rename JAR
        shell: pwsh
        run: |
          Move-Item -Path target/dist/AfterHours.jar -Destination "target/dist/${{ env.JAR_NAME }}"

      - name: Build Windows Installer
        shell: pwsh
        run: |
          mvn --batch-mode exec:exec@jpackage

      - name: Create Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path target/dist/AfterHours.jar,target/dist/AfterHours.bat,target/dist/AfterHours.sh,target/dist/javafx-mods -DestinationPath target/dist/AfterHours-portable.zip -Force

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          prerelease: ${{ env.PRE_RELEASE == 'true' }}
          files: |
            target/dist/After*-${{ env.APP_VERSION }}.exe
            target/dist/${{ env.JAR_NAME }}
            target/dist/AfterHours-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

