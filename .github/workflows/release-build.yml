name: Build And Publish Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.0.0-beta.1
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      app_version: ${{ steps.version.outputs.app_version }}
      pre_release: ${{ steps.version.outputs.pre_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve Version From Tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.event.release.tag_name }}"
          }
          if (-not $tag.StartsWith("v")) {
            throw "Tag must start with v. Got: $tag"
          }
          $version = $tag.Substring(1)
          $isPreRelease = if ($tag.Contains("-")) { "true" } else { "false" }
          "TAG_NAME=$tag"       | Out-File -FilePath $env:GITHUB_ENV    -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV    -Append
          "PRE_RELEASE=$isPreRelease" | Out-File -FilePath $env:GITHUB_ENV -Append
          "tag_name=$tag"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pre_release=$isPreRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set Maven Project Version
        shell: pwsh
        run: |
          mvn --batch-mode versions:set "-DnewVersion=${{ env.APP_VERSION }}" "-DgenerateBackupPoms=false"

      - name: Build Portable JAR
        shell: pwsh
        run: |
          mvn --batch-mode package -Pportable-jar -DskipTests

      - name: Rename JAR for release
        shell: pwsh
        run: |
          Rename-Item -Path "target/after-hours-$env:APP_VERSION-jar-with-dependencies.jar" -NewName "After Hours $env:APP_VERSION.jar"

      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $wixDir = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($wixDir) {
            "$($wixDir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            throw "WiX Toolset v3 not found — required for jpackage EXE build"
          }

      - name: Build Windows EXE
        shell: pwsh
        run: |
          mvn --batch-mode package -Pexe -DskipTests

      - name: Publish Release with Windows Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          prerelease: ${{ env.PRE_RELEASE == 'true' }}
          files: |
            target/After Hours ${{ env.APP_VERSION }}.jar
            target/dist/After Hours-${{ env.APP_VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set Maven Project Version
        run: mvn --batch-mode versions:set -DnewVersion="${{ needs.build-windows.outputs.app_version }}" -DgenerateBackupPoms=false

      - name: Build Linux App Image
        run: mvn --batch-mode package -Plinux -DskipTests

      - name: Upload Linux Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          files: |
            target/dist/After Hours-${{ needs.build-windows.outputs.app_version }}-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: build-windows
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set Maven Project Version
        run: mvn --batch-mode versions:set -DnewVersion="${{ needs.build-windows.outputs.app_version }}" -DgenerateBackupPoms=false

      - name: Build macOS DMG
        run: mvn --batch-mode package -Pmac -DskipTests

      - name: Upload macOS Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          files: |
            target/dist/After Hours-${{ needs.build-windows.outputs.app_version }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
