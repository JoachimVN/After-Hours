name: Get Project Info

on:
  workflow_dispatch:

jobs:
  get-project:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const query = `
            query {
              viewer {
                projectsV2(first: 20) {
                  nodes {
                    id
                    title
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            }`;

            const result = await github.graphql(query);
            console.log(JSON.stringify(result, null, 2));
